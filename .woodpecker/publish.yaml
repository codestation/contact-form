steps:
  lint:
    image: golangci/golangci-lint:v2.13.2
    commands:
      - golangci-lint run -v --timeout 10m
    environment:
      GOPROXY:
        from_secret: goproxy_url

  build:
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    settings:
      registry: registry.megpoid.dev
      repo: registry.megpoid.dev/codestation/contact-form
      tags:
        - '${CI_COMMIT_BRANCH}'
        - '${CI_COMMIT_BRANCH}-${CI_COMMIT_SHA:0:10}'
      build_args:
        GOPROXY:
          from_secret: goproxy_url
      config:
        from_secret: registry_credentials
    when:
      event:
        - push
        - manual

  build-tag:
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    settings:
      registry: registry.megpoid.dev
      repo: registry.megpoid.dev/codestation/contact-form
      tags:
        - latest
        - ${CI_COMMIT_TAG##v}
        - '${CI_COMMIT_BRANCH}'
        - '${CI_COMMIT_BRANCH}-${CI_COMMIT_SHA:0:10}'
      build_args:
        CI_COMMIT_TAG: "${CI_COMMIT_TAG}"
        GOPROXY:
          from_secret: goproxy_url
      config:
        from_secret: registry_credentials
    when:
      event: tag

when:
  event:
    - push
    - tag
    - manual
  branch:
    - master
